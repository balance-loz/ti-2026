events {}
http {
  server {
    listen 80;
    client_max_body_size 1m;
    location /api/ { proxy_pass http://api:3001; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
    location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
  }
}
