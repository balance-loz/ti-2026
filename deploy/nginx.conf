events {}
http {
  # Docker's embedded DNS, re-resolved so a restarted container is picked up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain;

  server {
    listen 80;
    client_max_body_size 1m;

    # The whole site is private, including static assets and the API. The
    # password file is written into the shared data volume by the api container
    # on start, from SITE_PASSWORD.
    auth_basic "Dota Predictor";
    auth_basic_user_file /srv/state/auth/htpasswd;

    # Left open so a monitor or the healthcheck can see the service is alive
    # without holding the password. It returns counts only, never match data.
    location = /api/health {
      auth_basic off;
      set $api_upstream api:3001;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
    }

    location /api/ {
      set $api_upstream api:3001;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 120s;
    }

    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
