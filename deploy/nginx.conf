events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain;
  server {
    listen 80;
    client_max_body_size 1m;
    location /api/ { set $api_upstream api:3001; proxy_pass http://$api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
    location / { set $web_upstream web:3000; proxy_pass http://$web_upstream; proxy_set_header Host $host; }
  }
}
