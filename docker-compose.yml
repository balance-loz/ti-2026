# Both services run the same image and differ only by command. Each declares
# the build so neither is ever treated as a registry pull; the context and
# Dockerfile are identical, so the second build is a cache hit, not a rebuild.
x-app-image: &app-image
  image: dota-predictor:${IMAGE_TAG:-local}
  build:
    context: .

services:
  web:
    <<: *app-image
    command: npm start -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *app-image
    command: node server/app.mjs
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATA_DIR: /app/data
      MODEL_DIR: /app/data/models

      # The server trains these two itself from the matches it collects, and
      # writes them to the data volume so a container rebuild keeps them.
      # Nothing is pre-seeded: a fresh install starts with no model and has its
      # own ratings within a minute of the first collection pass.
      TEAM_RATINGS_MODEL: /app/data/models/team-ratings.json
      DRAFT_TEMPORAL_MODEL: /app/data/models/draft-temporal-model.json
      # Read-only: the mid-game gold-lead layer has no retrainer yet, so it is
      # served from the image. Point it at a missing path to switch it off.
      LIVE_MAP_MODEL: /app/public/live-map-model.json
      OPENDOTA_CACHE_DIR: /app/data/opendota-cache
      # Anything dropped here is imported once, on its own, then retrained on.
      IMPORT_DIR: /app/data/import

      # The whole site sits behind one password. Required: without it the proxy
      # has no password file and would refuse every request.
      SITE_USER: ${SITE_USER:-admin}
      SITE_PASSWORD: ${SITE_PASSWORD:?set SITE_PASSWORD in .env — the site is private}

      # Leave empty for the free tier. A key raises the daily allowance and lets
      # the poll interval drop; see OPENDOTA_DAILY_LIMIT below.
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
      OPENDOTA_DAILY_LIMIT: ${OPENDOTA_DAILY_LIMIT:-}
      OPENDOTA_REQUEST_GAP_MS: ${OPENDOTA_REQUEST_GAP_MS:-}

      # Which tournaments get a page. Empty means every tier.
      TOURNAMENT_TIERS: ${TOURNAMENT_TIERS:-premium,professional}
      TOURNAMENT_LIVE_WINDOW_HOURS: ${TOURNAMENT_LIVE_WINDOW_HOURS:-24}
      TOURNAMENT_ACTIVE_WINDOW_DAYS: ${TOURNAMENT_ACTIVE_WINDOW_DAYS:-7}

      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      JOB_DISCOVER_MINUTES: ${JOB_DISCOVER_MINUTES:-60}
      JOB_SYNC_ACTIVE_MINUTES: ${JOB_SYNC_ACTIVE_MINUTES:-15}
      JOB_FORECAST_MINUTES: ${JOB_FORECAST_MINUTES:-20}
      JOB_COLLECT_HOURS: ${JOB_COLLECT_HOURS:-3}
      JOB_BACKFILL_MINUTES: ${JOB_BACKFILL_MINUTES:-30}
      JOB_DRAFT_DETAIL_MINUTES: ${JOB_DRAFT_DETAIL_MINUTES:-30}
      JOB_RETRAIN_HOURS: ${JOB_RETRAIN_HOURS:-24}
      JOB_IMPORT_MINUTES: ${JOB_IMPORT_MINUTES:-10}

      LIVE_DRAFT_INTERVAL_SECONDS: ${LIVE_DRAFT_INTERVAL_SECONDS:-20}
      LIVE_GAME_INTERVAL_SECONDS: ${LIVE_GAME_INTERVAL_SECONDS:-90}
      LIVE_IDLE_INTERVAL_SECONDS: ${LIVE_IDLE_INTERVAL_SECONDS:-300}

      HISTORY_DAYS: ${HISTORY_DAYS:-540}
      RATINGS_WINDOW_DAYS: ${RATINGS_WINDOW_DAYS:-540}
      DRAFT_WINDOW_DAYS: ${DRAFT_WINDOW_DAYS:-800}
      FORECAST_ITERATIONS: ${FORECAST_ITERATIONS:-20000}

      # Only needed to trigger a job by hand over the API. Leave empty to
      # disable the admin endpoints entirely.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - state:/app/data
      # Bind-mounted so an archive can be dropped in from the host at any time,
      # before or after the container exists. Copying into a named volume would
      # need a running container and force an order on the operator.
      - ./import:/app/data/import
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only view of the data volume, for the password file the api writes.
      - state:/srv/state:ro
    depends_on: [web, api]

volumes:
  state:
