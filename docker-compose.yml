services:
  web:
    build: .
    command: npm start -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped
    volumes:
      - stats:/app/public
  api:
    build: .
    command: node server/api.mjs
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TI_LEAGUE_ID: ${TI_LEAGUE_ID:-19719}
      LIVE_SYNC_ENABLED: ${LIVE_SYNC_ENABLED:-true}
      LIVE_SYNC_INTERVAL_MINUTES: ${LIVE_SYNC_INTERVAL_MINUTES:-10}
    volumes:
      - state:/app/data
      - stats:/app/public
      - opendota-cache:/app/work/opendota-cache
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]
volumes:
  state:
  stats:
  opendota-cache:
