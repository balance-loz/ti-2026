x-app-image: &app-image
  image: ti2026-app:${IMAGE_TAG:-local}
  build:
    context: .

services:
  web:
    <<: *app-image
    command: npm start -- --hostname 0.0.0.0 --port 3000
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-http://159.194.202.215}
    volumes:
      - stats:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
  api:
    <<: *app-image
    command: node server/api.mjs
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TI_LEAGUE_ID: ${TI_LEAGUE_ID:-19719}
      LIVE_SYNC_ENABLED: ${LIVE_SYNC_ENABLED:-true}
      LIVE_SYNC_INTERVAL_MINUTES: ${LIVE_SYNC_INTERVAL_MINUTES:-10}
      SCHEDULE_SYNC_ENABLED: ${SCHEDULE_SYNC_ENABLED:-true}
      SCHEDULE_SOURCE_URL: ${SCHEDULE_SOURCE_URL:-https://www.cybersport.ru/tournaments/dota-2/the-international-2026}
      SCHEDULE_TIMEZONE_OFFSET: ${SCHEDULE_TIMEZONE_OFFSET:-+03:00}
      AUTO_SNAPSHOT_ITERATIONS: ${AUTO_SNAPSHOT_ITERATIONS:-250000}
      AUTO_SNAPSHOT_MAX_ITERATIONS: ${AUTO_SNAPSHOT_MAX_ITERATIONS:-1000000}
      AUTO_SNAPSHOT_BATCH_SIZE: ${AUTO_SNAPSHOT_BATCH_SIZE:-250000}
      AUTO_SNAPSHOT_TOLERANCE_PP: ${AUTO_SNAPSHOT_TOLERANCE_PP:-0.10}
      DRAFT_MAX_NEW_MATCHES: ${DRAFT_MAX_NEW_MATCHES:-0}
      DRAFT_DB_PATH: /app/data/draft-model.sqlite
      DRAFT_TEMPORAL_MODEL: /app/model/draft-temporal-model.json
      ALL_PRO_TEAM_MODEL: /app/model/all-pro-team-model.json
      DRAFT_NEXTGEN_MODEL: /app/model/draft-nextgen-model.json
      NEXTGEN_SERIES_CALIBRATION: /app/model/nextgen-series-calibration.json
      TI_PLAYIN_START: ${TI_PLAYIN_START:-2026-08-17T00:00:00+08:00}
      TI_PLAYOFF_START: ${TI_PLAYOFF_START:-2026-08-20T00:00:00+08:00}
    volumes:
      - state:/app/data
      - stats:/app/public
      - opendota-cache:/app/work/opendota-cache
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [web, api]
volumes:
  state:
  stats:
  opendota-cache:
